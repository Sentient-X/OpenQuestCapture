apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"

    compileSdk **APIVERSION**
    buildToolsVersion = "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**

repositories {
    mavenCentral()
}
dependencies {
    implementation "androidx.appcompat:appcompat:1.5.1"
    // questcameralib.aar's QR decoder (pod setup); an AAR does not carry its dependencies.
    implementation "com.google.zxing:core:3.5.3"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    // sx-companion-release.aar (the phone companion, packages/sx-companion-android): its wire
    // classes are javalite, and it is built with Kotlin 2.2.20, whose stdlib wins over the 1.9
    // one kotlinx-serialization brings.
    implementation "com.google.protobuf:protobuf-javalite:4.29.3"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
}